name: ✨ 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use Case
      description: 你想解决什么问题？当前方案的痛点是什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你期望的行为或实现思路
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你考虑过的其他方案

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿 / Contribution
      options:
        - label: 我愿意提交 PR 实现该功能 / I am willing to submit a PR
